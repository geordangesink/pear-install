name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    name: Lint
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run lint

  test-node:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    name: Test with Node / ${{ matrix.platform }}
    timeout-minutes: 45
    steps:
      - uses: holepunchto/actions/node-base@v1
      - run: npm run test:node

  test-bare:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: darwin
          - os: windows-latest
            platform: win32
    runs-on: ${{ matrix.os }}
    name: Test with Bare / ${{ matrix.platform }}
    timeout-minutes: 2
    steps:
      - uses: holepunchto/actions/bare-base@v1
      - run: npm run test:bare
